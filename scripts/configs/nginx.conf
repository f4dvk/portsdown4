user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	gzip on;
	gzip_static on;
	gzip_disable "msie6";
	gzip_vary on;
	gzip_comp_level 5;
	gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript application/font-woff;

	##
	# Logging Settings
	##

	#access_log /var/log/nginx/access.log;
	access_log off;
	#error_log /var/log/nginx/error.log;
	error_log /dev/null;

	server {
		listen 80 default_server;
		listen [::]:80 default_server;

		index index.html;

		# Disable browser caching
		add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
		expires -1;

		location / {
			root /home/pi/webroot;
			index landing.html;
			autoindex off;
		}

		location /snaps {
			alias /home/pi/snaps/;
			autoindex on;
		}

		location /touchscreen {
			index index.html;
			alias /home/pi/webroot/;
			autoindex off;
		}

		location /touchscreen/screen.png {
			alias /home/pi/tmp/screen.png;
		}


		location /log.html {
			alias /home/pi/webroot/log.html;
		}

		location /touchscreen/decode.txt {
			alias /home/pi/rpidatv/406/decode.txt;
		}

		# Decodeur multiple : carte (page, positions en RAM, fond de carte hors ligne)
		location /multidec/ {
			alias /home/pi/rpidatv/src/multidec/web/;
			index index.html;
		}

		location = /multidec/state.json {
			alias /dev/shm/multidec/state.json;
		}

		location /multidec/map/ {
			alias /home/pi/multidec_map/;
			types {
				application/javascript js;
				text/css css;
				application/x-protobuf pbf;
				application/vnd.pmtiles pmtiles;
			}
		}

		# Son du Pi (server/stream.sh : carte son virtuelle -> md_audio, port 2007)
		location /touchscreen/audio {
			proxy_pass http://127.0.0.1:2007;
			proxy_buffering off;
			proxy_cache off;
			proxy_read_timeout 1h;
		}

        location /touchscreen/click {
            if ( $request_method !~ ^(POST)$ ) {
                return 405;
            }

            include /etc/nginx/fastcgi_params;
            fastcgi_param FN_HANDLER touchscreenClick;
            fastcgi_pass 127.0.0.1:2005;
	}

	}
}
