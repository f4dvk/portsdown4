<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="shortcut icon" href="/favicon_192x192.png" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Portsdown 4 Web Control</title>
  <style>
    #screen-canvas {
      background-color: black;
      cursor: pointer;
    }
    #piaudio { margin: 6px 0; font-family: sans-serif; }
    #pa-btn.on { background: #2a9e4b; color: #fff; }
    #pa-st { color: #555; margin: 0 10px; }
  </style>
  <script>
let canvas_el;
let canvas_ctx;
let canvas_image;

let canvasHeight;
let canvasWidth;

window.onload = function()
{
  canvas_el = document.getElementById('screen-canvas');
  canvas_ctx = canvas_el.getContext('2d');

  canvasHeight = canvas_el.clientHeight;
  canvasWidth = canvas_el.clientWidth;

  ImageLoad();
  setInterval(ImageLoad, 800);  // Voir pour le meilleur délai

  canvas_el.onclick = function(e)
  {
    const el_boundingRectangle = canvas_el.getBoundingClientRect();
    let clicked_x = e.clientX - el_boundingRectangle.left;
    let clicked_y = e.clientY - el_boundingRectangle.top;

    console.log('Canvas Click: X:', clicked_x,' Y:', clicked_y);

    var request = new XMLHttpRequest();
    request.open('POST', '/touchscreen/click', true);
    request.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
    request.send("x="+clicked_x+"&y="+clicked_y);

  };
  canvasInit();
};

const canvasInit = function()
{

  let devicePixelRatio = window.devicePixelRatio || 1;
  let backingStoreRatio = canvas_ctx.webkitBackingStorePixelRatio ||
                      canvas_ctx.mozBackingStorePixelRatio ||
                      canvas_ctx.msBackingStorePixelRatio ||
                      canvas_ctx.oBackingStorePixelRatio ||
                      canvas_ctx.backingStorePixelRatio || 1;
  let ratio = devicePixelRatio / backingStoreRatio;

  if (devicePixelRatio !== backingStoreRatio)
  {
    let oldWidth = canvas_el.width;
    let oldHeight = canvas_el.height;

    canvas_el.width = oldWidth * ratio;
    canvas_el.height = oldHeight * ratio;

    canvas_el.style.width = oldWidth + 'px';
    canvas_el.style.height = oldHeight + 'px';

    canvas_ctx.scale(ratio, ratio);
  }
}

const ImageLoad = function()
{
  canvas_image = new Image();
  canvas_image.src = './screen.png?t='+(new Date().getTime());
  canvas_image.onload = function()
  {
    canvas_el.width = canvas_image.width;
    canvas_el.height = canvas_image.height;
    canvas_ctx.drawImage(canvas_image, 0, 0);
  };
}

const ImageDownload = function()
{
  const a = document.createElement("a");
  a.href = canvas_image.src;
  a.download = "portsdown-screenshot_"+(new Date()).toISOString().replaceAll(':','꞉')+".png";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

const fft_fullscreen = function()
{
  if(canvas_el.requestFullscreen)
  {
    canvas_el.requestFullscreen();
  }
  else if(canvas_el.webkitRequestFullScreen)
  {
    canvas_el.webkitRequestFullScreen();
  }
  else if(canvas_el.mozRequestFullScreen)
  {
    canvas_el.mozRequestFullScreen();
  }
}

const checkFullScreen = function()
{
  if(typeof document.fullScreen != "undefined")
  {
    return document.fullScreen;
  }
  else if(typeof document.webkitIsFullScreen != "undefined")
  {
    return document.webkitIsFullScreen;
  }
  else if(typeof document.mozFullScreen != "undefined")
  {
    return document.mozFullScreen;
  }
  else
  {
    return false;
  }
}

let previousOrientation = window.orientation;
const checkOrientation = function()
{
  if(checkFullScreen())
  {
    if(window.orientation !== previousOrientation)
    {
      if (0 != (previousOrientation + window.orientation) % 180)
      {
        canvasWidth = window.innerHeight;
        canvasHeight = window.innerWidth;
        canvasInit();
      }

      previousOrientation = window.orientation;

      previousHeight = window.innerHeight;
      previousWidth = window.innerWidth;
    }
  }
};

let previousHeight = window.innerHeight;
let previousWidth = window.innerWidth;
const checkResize = function()
{
  if(!checkFullScreen()
    && (previousHeight != window.innerHeight || previousWidth != window.innerWidth))
  {
    canvasHeight = 550;
    //canvasWidth = $("#fft-col").width();
    canvasInit();

    previousHeight = window.innerHeight;
    previousWidth = window.innerWidth;
  }
}

window.addEventListener("fullscreenchange", function()
{
  if(checkFullScreen())
  {
    setTimeout(function() {
      /* Set canvas to full document size */
      canvasHeight = canvas_el.clientHeight;
      canvasWidth = canvas_el.clientWidth;
      canvasInit();
    },10);
  }
  else
  {
    /* Reset canvas size */
    canvasHeight = 480;
    canvasWidth = 800;
    canvasInit();
  }
});

window.addEventListener("resize", checkResize, false);
window.addEventListener("orientationchange", checkOrientation, false);
// Android doesn't always fire orientationChange on 180 degree turns
setInterval(checkOrientation, 2000);
</script>
</head>
<body>
  <canvas width="800" height="480" id="screen-canvas"></canvas>
  <!-- <button id="fullscreen-link" onclick="fft_fullscreen();">Open fullscreen</button> -->
  <button onclick="ImageDownload();">Download screenshot</button>
  <div id="piaudio">
    <button id="pa-btn" title="Sound of the Raspberry Pi (RTL-FM receiver, Multi Decoder...)">&#128264; Pi audio</button>
    <span id="pa-st">off</span>
    Volume <input id="pa-vol" type="range" min="0" max="2" step="0.05" value="1">
  </div>
  <script>
// Ecoute du Pi : le son que les applications jouent sur la carte son
// virtuelle (recepteur RTL-FM, decodeur multiple...), servi par
// server/stream.sh (md_audio : 16 bits bruts, en-tetes X-Rate et X-Channels),
// joue par Web Audio avec 0,25 s d'avance ; reconnexion toutes les 2 s
(function () {
  const btn = document.getElementById("pa-btn"), st = document.getElementById("pa-st"),
        vol = document.getElementById("pa-vol");
  let on = false, ctx = null, gain = null, ctl = null;
  const say = (s) => { st.textContent = s; };
  async function run() {
    while (on) {
      try {
        ctl = new AbortController();
        const r = await fetch("/touchscreen/audio?t=" + Date.now(), { cache: "no-store", signal: ctl.signal });
        if (!r.ok) throw new Error(r.status);
        const rate = +r.headers.get("X-Rate") || 48000, ch = +r.headers.get("X-Channels") || 1, fb = 2 * ch;
        const rd = r.body.getReader();
        let rest = new Uint8Array(0), t = 0;
        say("playing (" + rate + " Hz" + (ch > 1 ? " stereo" : "") + ")");
        for (;;) {
          const { value, done } = await rd.read();
          if (done || !on) break;
          let b = value;
          if (rest.length) { const m = new Uint8Array(rest.length + b.length); m.set(rest); m.set(b, rest.length); b = m; }
          const frames = Math.floor(b.length / fb);
          rest = b.slice(frames * fb);
          if (!frames) continue;
          const dv = new DataView(b.buffer, b.byteOffset, frames * fb), ab = ctx.createBuffer(ch, frames, rate);
          for (let c = 0; c < ch; c++) {
            const d = ab.getChannelData(c);
            for (let i = 0; i < frames; i++) d[i] = dv.getInt16((i * ch + c) * 2, true) / 32768;
          }
          const now = ctx.currentTime;
          if (t < now + 0.03 || t > now + 1.0) t = now + 0.25;   // depart, trou, ou trop de retard
          const src = ctx.createBufferSource();
          src.buffer = ab;
          src.connect(gain);
          src.start(t);
          t += ab.duration;
        }
      } catch (e) {
        if (!on) break;
      }
      if (on) {
        say("waiting for sound");
        await new Promise((ok) => setTimeout(ok, 2000));
      }
    }
  }
  btn.onclick = function () {
    on = !on;
    btn.classList.toggle("on", on);
    if (on) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      gain = ctx.createGain();
      gain.gain.value = +vol.value;
      gain.connect(ctx.destination);
      say("connecting...");
      run();
    } else {
      if (ctl) ctl.abort();
      if (ctx) ctx.close();
      ctx = null;
      say("off");
    }
  };
  vol.oninput = function () { if (gain) gain.gain.value = +vol.value; };
})();
  </script>
  <div>
  <object width="350" height="200" content="text/html; charset=UTF-8859-1" data="log_run.html"></object>
  </div>
</body>
</html>
